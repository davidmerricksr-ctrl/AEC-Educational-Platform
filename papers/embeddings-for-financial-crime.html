<body>
<div id="root"></div>
<script type="text/babel">
const {useState}=React;

const C={

const SECTIONS=[
  {id:'concept',title:'What Are Embeddings?',icon:'◈'},
  {id:'how',title:'How They Work',icon:'⚙'},
  {id:'why',title:'Why This Matters for Financial Crime',icon:'🛡'},
  {id:'engine',title:'Counterparty Risk Rating Engine',icon:'🏗'},
  {id:'sources',title:'Data Sources & What They Contribute',icon:'📥'},
  {id:'example',title:'Worked Example',icon:'🔍'},
  {id:'flows',title:'Integration Into Compliance Flows',icon:'🔀'},
];

function Card({children,accent,style}){
  return <div style={{background:C.card,border:`1px solid ${accent?accent+'33':C.bdr}`,borderRadius:14,padding:18,marginBottom:14,...style}}>{children}</div>;
}

function SectionLabel({children,color}){
  return <div className="mono" style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'1.8px',color:color||C.indigo,marginBottom:10}}>{children}</div>;
}

function AccentItem({color,children,style}){
  return <div style={{borderLeft:`2px solid ${color||C.indigo}`,paddingLeft:14,marginBottom:10,...style}}>{children}</div>;
}

function NumberBadge({n,color}){
  return <div style={{width:32,height:32,borderRadius:8,background:color+'22',color:color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:14,flexShrink:0}} className="mono">{n}</div>;
}

/* ── Section 1: What Are Embeddings? ── */
function SectionConcept(){
  return <div className="fi">
    <Card accent={C.indigo} style={{borderLeft:`2px solid ${C.indigo}`}}>
      <SectionLabel color={C.indigo}>THE SIMPLE IDEA</SectionLabel>
      <p style={{fontSize:14,color:C.tx,lineHeight:1.7,marginBottom:12}}>An embedding turns something complex — a name, a document, a company profile — into a list of numbers (a 'vector'). These numbers encode meaning. Things that are similar in the real world end up close together in number space. Things that are different end up far apart.</p>
      <p style={{fontSize:13,color:C.muted,lineHeight:1.7}}>Think of it like coordinates on a map. London and Paris are close together. London and Tokyo are far apart. Embeddings do the same thing but for concepts, entities, and risk profiles — placing them in a mathematical space where distance equals similarity.</p>
    </Card>

    <Card accent={C.indigo}>
      <SectionLabel color={C.indigo}>VISUAL EXAMPLE</SectionLabel>
      <div style={{overflowX:'auto',marginBottom:12}}>
        <svg viewBox="0 0 780 520" style={{width:'100%',minWidth:600,height:'auto'}} xmlns="http://www.w3.org/2000/svg">
          {/* Left column: text strings */}
          <rect x="10" y="20" width="160" height="36" rx="6" fill="#0d1017" stroke="#1c1f2e"/>
          <text x="90" y="43" textAnchor="middle" fill="#eef0ff" fontSize="13" fontFamily="'Libre Franklin',sans-serif">"Bank"</text>
          <rect x="10" y="70" width="160" height="36" rx="6" fill="#0d1017" stroke="#1c1f2e"/>
          <text x="90" y="93" textAnchor="middle" fill="#eef0ff" fontSize="12" fontFamily="'Libre Franklin',sans-serif">"Financial institution"</text>
          <rect x="10" y="120" width="160" height="36" rx="6" fill="#0d1017" stroke="#1c1f2e"/>
          <text x="90" y="143" textAnchor="middle" fill="#eef0ff" fontSize="13" fontFamily="'Libre Franklin',sans-serif">"Llama"</text>

          {/* Arrows */}
          <line x1="175" y1="38" x2="280" y2="38" stroke="#6366f1" strokeWidth="1.5" markerEnd="url(#arrowhead)"/>
          <line x1="175" y1="88" x2="280" y2="88" stroke="#6366f1" strokeWidth="1.5" markerEnd="url(#arrowhead)"/>
          <line x1="175" y1="138" x2="280" y2="138" stroke="#6366f1" strokeWidth="1.5" markerEnd="url(#arrowhead)"/>
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
            </marker>
          </defs>

          {/* Middle label */}
          <rect x="210" y="72" width="65" height="20" rx="4" fill="#6366f122"/>
          <text x="242" y="86" textAnchor="middle" fill="#6366f1" fontSize="9" fontFamily="'IBM Plex Mono',monospace">Embedding</text>
          <text x="242" y="67" textAnchor="middle" fill="#6366f1" fontSize="9" fontFamily="'IBM Plex Mono',monospace">Model</text>

          {/* Right column: vectors */}
          <text x="295" y="43" fill="#22c55e" fontSize="12" fontFamily="'IBM Plex Mono',monospace">[0.82, 0.91, 0.15, 0.73]</text>
          <text x="295" y="93" fill="#22c55e" fontSize="12" fontFamily="'IBM Plex Mono',monospace">[0.79, 0.88, 0.18, 0.70]</text>
          <text x="295" y="143" fill="#ef4444" fontSize="12" fontFamily="'IBM Plex Mono',monospace">[0.12, 0.08, 0.95, 0.04]</text>

          {/* Far right: similarity annotations */}
          <line x1="545" y1="43" x2="545" y2="93" stroke="#22c55e" strokeWidth="1" strokeDasharray="4,3"/>
          <text x="560" y="72" fill="#22c55e" fontSize="11" fontFamily="'IBM Plex Mono',monospace">0.97 similar</text>
          <line x1="545" y1="93" x2="545" y2="143" stroke="#ef4444" strokeWidth="1" strokeDasharray="4,3"/>
          <text x="560" y="122" fill="#ef4444" fontSize="11" fontFamily="'IBM Plex Mono',monospace">0.11 similar</text>

          {/* Dashed connecting bracket lines */}
          <circle cx="540" cy="43" r="3" fill="#22c55e"/>
          <circle cx="540" cy="93" r="3" fill="#22c55e"/>
          <circle cx="540" cy="143" r="3" fill="#ef4444"/>

          {/* Bottom left scatter plot */}
          <rect x="10" y="200" width="350" height="200" rx="8" fill="#080a10" stroke="#1c1f2e"/>
          <text x="185" y="225" textAnchor="middle" fill="#5a6080" fontSize="10" fontFamily="'IBM Plex Mono',monospace">Vector space (2D projection)</text>
          {/* Axes */}
          <line x1="40" y1="370" x2="340" y2="370" stroke="#1c1f2e" strokeWidth="1"/>
          <line x1="40" y1="240" x2="40" y2="370" stroke="#1c1f2e" strokeWidth="1"/>
          {/* Bank and Financial inst clustered */}
          <circle cx="120" cy="280" r="6" fill="#3b82f6"/>
          <text x="132" y="284" fill="#3b82f6" fontSize="10" fontFamily="'Libre Franklin',sans-serif">Bank</text>
          <circle cx="140" cy="295" r="6" fill="#3b82f6"/>
          <text x="152" y="299" fill="#3b82f6" fontSize="10" fontFamily="'Libre Franklin',sans-serif">Financial inst.</text>
          {/* Llama far away */}
          <circle cx="290" cy="350" r="6" fill="#ef4444"/>
          <text x="255" y="345" fill="#ef4444" fontSize="10" fontFamily="'Libre Franklin',sans-serif">Llama</text>

          {/* Bottom right scatter plot */}
          <rect x="390" y="200" width="380" height="200" rx="8" fill="#080a10" stroke="#1c1f2e"/>
          <text x="580" y="225" textAnchor="middle" fill="#5a6080" fontSize="10" fontFamily="'IBM Plex Mono',monospace">Risk entity space</text>
          {/* Axes */}
          <line x1="420" y1="370" x2="750" y2="370" stroke="#1c1f2e" strokeWidth="1"/>
          <line x1="420" y1="240" x2="420" y2="370" stroke="#1c1f2e" strokeWidth="1"/>
          {/* Low-risk cluster */}
          <circle cx="480" cy="330" r="6" fill="#22c55e"/>
          <text x="492" y="334" fill="#22c55e" fontSize="10" fontFamily="'Libre Franklin',sans-serif">Low-risk co.</text>
          <circle cx="500" cy="345" r="6" fill="#22c55e"/>
          <text x="512" y="349" fill="#22c55e" fontSize="10" fontFamily="'Libre Franklin',sans-serif">Retail bank</text>
          {/* High-risk cluster */}
          <circle cx="680" cy="270" r="6" fill="#ef4444"/>
          <text x="692" y="274" fill="#ef4444" fontSize="10" fontFamily="'Libre Franklin',sans-serif">Shell company</text>
          <circle cx="700" cy="285" r="6" fill="#ef4444"/>
          <text x="712" y="289" fill="#ef4444" fontSize="10" fontFamily="'Libre Franklin',sans-serif">Sanctioned entity</text>
          {/* Your counterparty amber dot */}
          <circle cx="590" cy="305" r="7" fill="#f59e0b"/>
          <text x="560" y="298" fill="#f59e0b" fontSize="10" fontFamily="'Libre Franklin',sans-serif" fontWeight="600">Your counterparty?</text>

          {/* Labels for scatter axes */}
          <text x="185" y="390" textAnchor="middle" fill="#5a6080" fontSize="9" fontFamily="'IBM Plex Mono',monospace">Dimension 1</text>
          <text x="580" y="390" textAnchor="middle" fill="#5a6080" fontSize="9" fontFamily="'IBM Plex Mono',monospace">Risk Dimension 1</text>
        </svg>
      </div>
      <p style={{fontSize:11,color:C.muted,lineHeight:1.6}}>'Bank' and 'Financial institution' get similar vectors because they mean similar things. 'Llama' gets a completely different vector. The cosine similarity between the first two is 0.97 (nearly identical); between 'Bank' and 'Llama' it's 0.11 (unrelated). The same principle applies to entity risk profiles — a shell company with hidden ownership clusters near other shell companies, not near transparent retail banks.</p>
    </Card>

    <Card accent={C.indigo}>
      <SectionLabel color={C.indigo}>KEY PROPERTIES</SectionLabel>
      <AccentItem color={C.indigo}>
        <div style={{fontSize:14,fontWeight:700,color:C.tx,marginBottom:2}}>Similarity = proximity</div>
        <div style={{fontSize:13,color:C.body,lineHeight:1.6}}>Similar entities have vectors that are close together. You can measure closeness with cosine similarity — a number from 0 (unrelated) to 1 (identical).</div>
      </AccentItem>
      <AccentItem color={C.indigo}>
        <div style={{fontSize:14,fontWeight:700,color:C.tx,marginBottom:2}}>Multi-dimensional</div>
        <div style={{fontSize:13,color:C.body,lineHeight:1.6}}>A real embedding might have 128 or 256 dimensions, each encoding a different aspect — jurisdiction risk, ownership complexity, media exposure, transaction patterns. Humans can't visualise 256 dimensions, but maths works fine in them.</div>
      </AccentItem>
      <AccentItem color={C.indigo}>
        <div style={{fontSize:14,fontWeight:700,color:C.tx,marginBottom:2}}>Learned, not hand-coded</div>
        <div style={{fontSize:13,color:C.body,lineHeight:1.6}}>The model learns which features matter from historical data — which entity profiles ended up in SARs, which were sanctioned, which were exited. No human manually writes rules for what makes entities similar.</div>
      </AccentItem>
      <AccentItem color={C.indigo} style={{marginBottom:0}}>
        <div style={{fontSize:14,fontWeight:700,color:C.tx,marginBottom:2}}>Cross-modal</div>
        <div style={{fontSize:13,color:C.body,lineHeight:1.6}}>You can embed different types of data — names, documents, transaction patterns, corporate structures — into the same vector space. This lets you compare a company's registration profile against its media footprint against its transaction behaviour.</div>
      </AccentItem>
    </Card>
  </div>;
}

/* ── Section 2: How They Work ── */
function SectionHow(){
  return <div className="fi">
    <Card accent={C.blue} style={{borderLeft:`2px solid ${C.blue}`}}>
      <SectionLabel color={C.blue}>THE PROCESS — THREE STEPS</SectionLabel>
      <div style={{display:'flex',gap:14,alignItems:'flex-start',marginBottom:16}}>
        <NumberBadge n="1" color={C.blue}/>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:C.tx,marginBottom:2}}>Collect data about the entity</div>
          <div style={{fontSize:13,color:C.body,lineHeight:1.6}}>Gather everything available: company registration, directors, addresses, sanctions screening results, media articles, transaction history. Each data type goes through a specialised model.</div>
        </div>
      </div>
      <div style={{display:'flex',gap:14,alignItems:'flex-start',marginBottom:16}}>
        <NumberBadge n="2" color={C.indigo}/>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:C.tx,marginBottom:2}}>Convert to numbers (embed)</div>
          <div style={{fontSize:13,color:C.body,lineHeight:1.6}}>Each data source produces a partial vector. A name embedding model handles the company name and director names. A document model processes media articles and filings. A structured data model handles registration details, SIC codes, and dates. These partial vectors are fused into one composite vector.</div>
        </div>
      </div>
      <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
        <NumberBadge n="3" color={C.purple}/>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:C.tx,marginBottom:2}}>Compare against reference points</div>
          <div style={{fontSize:13,color:C.body,lineHeight:1.6}}>The entity's vector is compared against known clusters: sanctioned entities, SAR-filed cases, high-risk typologies, and low-risk baselines. Cosine similarity tells you how close this entity is to each cluster. That proximity IS the risk score.</div>
        </div>
      </div>
    </Card>

    <Card>
      <SectionLabel color={C.muted}>ANALOGY: HOW YOUR BRAIN ALREADY DOES THIS</SectionLabel>
      <p style={{fontSize:12,color:C.body,lineHeight:1.7}}>When an experienced investigator sees a company registered at a known formation agent address, with a single foreign director, no filed accounts, and a commodity-trading name — they instinctively feel 'this looks like a shell company.' They're not running explicit rules. Their brain has built an internal model from seeing thousands of entities, and this one's 'pattern' matches the shell company pattern. Embeddings do the same thing, but mathematically, consistently, at scale, and with an audit trail. The investigator's intuition becomes a measurable vector distance.</p>
    </Card>
  </div>;
}

/* ── Section 3: Why This Matters ── */
function SectionWhy(){
  const problems=[
    {title:"Name matching fails across scripts and transliterations",body:"Embedding similarity captures that 'Банк' and 'Bank' are the same concept, that 'Mohammad' and 'Muhammad' and 'محمد' refer to the same name, without explicit rules for every variant."},
    {title:"Rules can't capture combinatorial risk",body:"No single attribute screams 'shell company' — but the COMBINATION of virtual address + single foreign director + overdue accounts + mismatched SIC code does. Embeddings encode the combination, not individual fields."},
    {title:"Counterparties are blind spots",body:"Entities that aren't your customers have no KYC file. But public data (Companies House, media, World-Check) can be embedded to create a risk profile for ANY entity — customer or not."},
    {title:"Static risk ratings decay",body:"A company rated low-risk at onboarding may drift toward high-risk as directors change, media articles appear, or related entities get sanctioned. Embedding-based ratings update continuously."},
    {title:"Siloed systems miss cross-domain signals",body:"A sanctions near-miss that also shows adverse media AND shell company characteristics is far more concerning than any single signal. Embeddings fuse all signals into one representation."},
  ];
  return <div className="fi">
    <Card accent={C.red} style={{borderLeft:`2px solid ${C.red}`}}>
      <SectionLabel color={C.red}>THE PROBLEM EMBEDDINGS SOLVE</SectionLabel>
      {problems.map((p,i)=>(
        <div key={i} style={{background:'#080a10',borderRadius:10,padding:14,marginBottom:i<problems.length-1?10:0}}>
          <div style={{fontSize:13,fontWeight:700,color:C.tx,marginBottom:4}}>{p.title}</div>
          <div style={{fontSize:13,color:C.body,lineHeight:1.6}}>→ {p.body}</div>
        </div>
      ))}
    </Card>
  </div>;
}

/* ── Section 4: Engine ── */
function SectionEngine(){
  const steps=[
    {n:'1',title:'Counterparty name appears',body:"A name surfaces on a payment message, in a beneficial ownership chain, or as a trade counterparty. The engine receives the name and any available identifiers (address, jurisdiction, company number)."},
    {n:'2',title:'Automated source lookups',body:"The engine queries Companies House (UK registry), World-Check (sanctions/PEP database from LSEG), Ripjar (adverse media AI platform), and runs a broad media screen — all automatically, in seconds."},
    {n:'3',title:'Entity resolution',body:"Results from all four sources are resolved to confirm they refer to the same real-world entity. Director names from Companies House are matched against World-Check and media results."},
    {n:'4',title:'Embedding generation',body:"Structured data (registration date, SIC code, address, filing status, director nationality) and unstructured data (media articles, sanctions narrative text) are embedded into a composite vector."},
    {n:'5',title:'Similarity comparison',body:"The embedding is compared against reference clusters: known shell companies, sanctioned entity profiles, SAR-associated entities, and low-risk baselines. Proximity to each cluster becomes a dimension score."},
    {n:'6',title:'Risk score + API output',body:"The engine outputs: composite risk score (0–100), individual dimension scores with source attribution, confidence levels, nearest historical match, and recommended actions. Available via real-time API."},

/* ── Section 5: Sources ── */
function SectionSources(){
  return <div className="fi">
    {/* Companies House */}
    <Card accent={C.blue} style={{borderLeft:`2px solid ${C.blue}`}}>
      <SectionLabel color={C.blue}>1. COMPANIES HOUSE (UK) 🏛</SectionLabel>
      <div style={{marginBottom:14}}>
        <div className="mono" style={{fontSize:10,letterSpacing:'1.8px',color:C.blue,textTransform:'uppercase',marginBottom:8}}>WHAT IT PROVIDES</div>
        <AccentItem color={C.blue}><span style={{fontSize:13,color:C.body}}>Company status, incorporation date, registered address</span></AccentItem>

  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

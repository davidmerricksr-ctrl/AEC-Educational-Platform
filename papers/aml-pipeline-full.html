<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Correspondent Banking AML Pipeline — All Phases</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html{background:#06070e;color:#c8cde0;font-family:'Source Sans 3',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100vh}
#root{min-height:100vh}
code,pre,.mono{font-family:'Source Code Pro',monospace}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0c0d18}
::-webkit-scrollbar-thumb{background:#2a2d44;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .35s ease-out both}
a{text-decoration:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ── Constants ── */
const C={
  bg:'#06070e',card:'#0c0d18',cardHi:'#10112a',
  bdr:'#181a2e',bdrHi:'#252840',
  tx:'#eef0ff',body:'#c8cde0',dim:'#8890b0',muted:'#5a6080',
  slate:'#64748b',cyan:'#0ea5e9',blue:'#3b82f6',orange:'#f97316',
  purple:'#8b5cf6',rose:'#e11d48',indigo:'#6366f1',red:'#ef4444',
  fuchsia:'#d946ef',green:'#22c55e',amber:'#f59e0b',gray:'#5a6080',
};
const PHASE_COLORS=[C.slate,C.cyan,C.blue,C.orange,C.purple,C.rose,C.cyan,C.indigo,C.red,C.fuchsia];
const PHASE_ICONS=['\u26A1','\uD83D\uDCCB','\u25C8','\u2699','\uD83D\uDD0D','\uD83D\uDCE8','\uD83D\uDCC4','\u25C8\u25C8','\u25C9','\uD83C\uDFE6'];
const PHASE_TITLES=['Detection Alert','Data Inventory','First Embedding','ML Triage','Investigation','Targeted RFI','Doc Ingestion','Second Embedding','Final Decision','Respondent Risk'];
const PHASE_SUBS=['Oracle Mantas / Quantexa fires on wire','What you actually know','Embed available intelligence','GBM scoring + routing','Accelerated with AI tools','Fill the gaps','OCR + cross-reference','Re-embed with full picture','GBM re-score + action','Cumulative client risk \u2192 EDD \u2192 Exit'];
const SCORE_PHASES={3:'74%',4:'74%',5:'74%',8:'96%'};

/* ── Shared Helper Components ── */
function Badge({color,children,mono}){
  return <span style={{display:'inline-block',fontSize:11,fontWeight:700,fontFamily:mono?'Source Code Pro,monospace':'inherit',color,background:color+'18',padding:'2px 10px',borderRadius:4,letterSpacing:'.04em',textTransform:'uppercase'}}>{children}</span>;
}
function ScoreBadge({value,color}){
  return <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:48,height:48,borderRadius:'50%',background:color+'22',border:`2px solid ${color}`,fontSize:16,fontWeight:800,color,fontFamily:'Source Code Pro,monospace'}}>{value}</span>;
}
function Section({title,accent,children,border}){
  return <div style={{marginBottom:24}}>{title&&<div style={{fontSize:12,fontWeight:700,color:accent||C.dim,letterSpacing:'.12em',textTransform:'uppercase',marginBottom:12}}>{title}</div>}{border?<div style={{borderLeft:`3px solid ${accent||C.bdr}`,paddingLeft:16}}>{children}</div>:children}</div>;
}
function CardBox({children,accent,highlight,style}){
  return <div style={{background:highlight?C.cardHi:C.card,border:`1px solid ${accent?accent+'33':C.bdr}`,borderRadius:12,padding:'20px 24px',marginBottom:16,...style}}>{children}</div>;
}
function Collapsible({title,badge,badgeColor,children,defaultOpen}){
  const[open,setOpen]=useState(!!defaultOpen);
  return <CardBox><div onClick={()=>setOpen(!open)} style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',userSelect:'none'}}><div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:15,fontWeight:600,color:C.tx}}>{title}</span>{badge&&<Badge color={badgeColor||C.green}>{badge}</Badge>}</div><span style={{color:C.muted,fontSize:18,transition:'transform .2s',transform:open?'rotate(180deg)':'rotate(0)'}}>{'\u25BE'}</span></div>{open&&<div style={{marginTop:16,paddingTop:16,borderTop:`1px solid ${C.bdr}`}}>{children}</div>}</CardBox>;
}
function KVRow({label,value,accent,mono}){
  return <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'6px 0',borderLeft:accent?`3px solid ${accent}`:'none',paddingLeft:accent?12:0,gap:12}}><span style={{color:C.dim,fontSize:14,minWidth:0,flex:'0 0 auto'}}>{label}</span><span style={{color:C.tx,fontSize:14,fontFamily:mono?'Source Code Pro,monospace':'inherit',textAlign:'right',wordBreak:'break-word'}}>{value}</span></div>;
}
function EmbedBar({label,value,maxVal,confidence,source,color,prevValue}){
  const confColor=confidence==='HIGH'?C.green:confidence==='MEDIUM'?C.amber:C.muted;
  return <div style={{marginBottom:14}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}><span style={{fontSize:14,color:C.tx,fontWeight:500}}>{label}</span><div style={{display:'flex',alignItems:'center',gap:8}}><Badge color={confColor}>{confidence}</Badge><span className="mono" style={{fontSize:14,fontWeight:700,color:color||C.blue}}>{(value*1).toFixed(2)}</span></div></div><div style={{position:'relative',height:8,background:C.bdr,borderRadius:4,overflow:'hidden'}}>{prevValue!==undefined&&<div style={{position:'absolute',left:0,top:0,bottom:0,width:`${prevValue*100}%`,background:(color||C.blue)+'33',borderRadius:4,transition:'width .4s'}}/>}<div style={{position:'absolute',left:0,top:0,bottom:0,width:`${value*100}%`,background:color||C.blue,borderRadius:4,transition:'width .4s'}}/></div>{source&&<div style={{fontSize:12,color:C.muted,marginTop:3,fontStyle:'italic'}}>"{source}"</div>}</div>;
}
function ShapBar({label,value,color}){
  const maxMag=0.24;const pct=Math.min(Math.abs(value)/maxMag*100,100);const isPos=value>0;
  return <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><div style={{width:200,textAlign:'right',fontSize:13,color:C.body,flexShrink:0}}>{label}</div><div style={{flex:1,position:'relative',height:20}}><div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:C.bdr}}/>{isPos?<div style={{position:'absolute',left:'50%',top:2,bottom:2,width:`${pct/2}%`,background:C.red,borderRadius:'0 3px 3px 0',transition:'width .3s'}}/>:<div style={{position:'absolute',right:'50%',top:2,bottom:2,width:`${pct/2}%`,background:C.green,borderRadius:'3px 0 0 3px',transition:'width .3s'}}/>}</div><span className="mono" style={{width:50,fontSize:12,fontWeight:600,color:isPos?C.red:C.green,textAlign:'right',flexShrink:0}}>{isPos?'+':''}{value.toFixed(2)}</span></div>;
}
function InsightBox({accent,children}){
  return <div style={{borderLeft:`3px solid ${accent||C.blue}`,background:accent?accent+'08':C.blue+'08',padding:'16px 20px',borderRadius:'0 8px 8px 0',marginTop:16,marginBottom:16,fontSize:14,color:C.body,lineHeight:1.7}}>{children}</div>;
}
function CheckItem({icon,status,color,children}){
  return <div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'6px 0',borderLeft:`3px solid ${color||C.green}`,paddingLeft:12,marginBottom:4}}><span style={{color:color||C.green,flexShrink:0,fontSize:14}}>{icon||'\u2713'}</span><span style={{fontSize:14,color:status==='red'?C.red:status==='amber'?C.amber:C.body}}>{children}</span></div>;
}
function PaymentChain(){
  const nodes=[
    {label:'Originator\n(Sender)',color:C.muted},
    {label:'Respondent Bank\n(Your Client)',color:C.orange},
    {label:'Your Bank\n(Correspondent)',color:C.blue},
    {label:'Downstream PSP\n(Destination)',color:C.purple},
    {label:'Beneficiary\n(Recipient)',color:C.muted},
  ];
  return <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:0,padding:'16px 0',overflowX:'auto',minWidth:0}}>
    {nodes.map((n,i)=><React.Fragment key={i}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',minWidth:90,maxWidth:130,flex:'0 0 auto'}}>
        <div style={{border:`2px solid ${n.color}`,borderRadius:8,padding:'8px 10px',background:n.color+'12',textAlign:'center',width:'100%'}}>
          {n.label.split('\n').map((l,j)=><div key={j} style={{fontSize:j===0?13:11,fontWeight:j===0?700:400,color:j===0?n.color:C.dim,lineHeight:1.3}}>{l}</div>)}
        </div>
      </div>
      {i<nodes.length-1&&<div style={{width:28,height:2,background:C.bdr,flexShrink:0,position:'relative'}}><div style={{position:'absolute',right:-3,top:-4,fontSize:10,color:C.muted}}>{'\u2192'}</div></div>}
    </React.Fragment>)}
  </div>;
}

/* ── Phase 01: Detection Alert ── */
function Phase01(){
  return <div className="fade-in">
    <p style={{fontSize:15,color:C.body,marginBottom:24}}>The detection engine (Oracle Financial Services AML or Quantexa Contextual Monitoring) flags a wire based on scenario rules or contextual behavioral detection applied to the SWIFT message fields. As correspondent, you have the payment payload, your relationship data on the respondent, and transaction history for parties you've previously seen.</p>
    <Section title="Payment Message (MT103 / pacs.008)" accent={C.slate}>
      <div style={{fontSize:13,color:C.muted,marginBottom:12,fontStyle:'italic'}}>This is ALL that arrives at your bank when the wire hits. Every field below is parsed from the SWIFT message.</div>
      <CardBox>
        <KVRow label="Sender's Ref (F20)" value="FCB20260418-7741" mono/>
        <KVRow label="Value/Amount (F32A)" value="260218 USD 2,450,000.00" mono/>
        <KVRow label="Ordering Customer (F50K)" value="SILK ROAD COMMODITIES FZE / PO BOX 18447 JAFZA, DUBAI UAE" accent={C.orange} mono/>
        <KVRow label="Ordering Inst. (F52A)" value="FCBKGETB — First Commerce Bank of Eurasia, Tbilisi" mono/>
        <KVRow label="Intermediary (F56A)" value="YOUR BANK — Correspondent" mono/>
        <KVRow label="Acct With Inst. (F57A)" value="DEUTDEFF — Deutsche Bank Frankfurt (downstream PSP)" mono/>
        <KVRow label="Beneficiary (F59)" value="VOSTOK INDUSTRIAL SUPPLY GMBH / HAMBURGER STRASSE 42, HAMBURG" accent={C.purple} mono/>
        <KVRow label="Remittance (F70)" value="INV-2026-TR-4418 COTTON FIBER SHIPMENT" accent={C.amber} mono/>
      </CardBox>
    </Section>
    <Section title="Detection Engine Alert" accent={C.slate}>
      <CardBox>
        <KVRow label="Alert ID" value="DET-2026-074821" mono/>
        <KVRow label="Engine" value="Oracle Financial Services AML (Mantas) / Quantexa Contextual Monitoring" />
        <KVRow label="Scenario" value="SCN-CB-401: High-value trade wire, high-risk corridor" mono/>
        <KVRow label="Detection Score" value="72 / 100" mono/>
        <div style={{marginTop:12}}><div style={{fontSize:12,fontWeight:600,color:C.dim,marginBottom:6}}>TRIGGERED FACTORS</div>
          {['Amount > $1M','JAFZA free zone originator','Commodity keyword in F70','Georgia respondent jurisdiction','First-time beneficiary'].map((f,i)=><div key={i} style={{borderLeft:`3px solid ${C.slate}`,paddingLeft:10,fontSize:13,color:C.body,marginBottom:4}}>{f}</div>)}
        </div>
      </CardBox>
      <div style={{fontSize:13,color:C.muted,fontStyle:'italic',marginTop:8}}>Whether alert originates from Mantas scenario-based detection or Quantexa contextual monitoring, the downstream embedding pipeline adds intelligence layers neither captures natively.</div>
    </Section>
    <InsightBox accent={C.orange}>
      <strong style={{color:C.tx}}>Key Constraint:</strong> You are in the middle of this chain. The originator's KYC belongs to your respondent bank. The beneficiary's KYC belongs to the downstream PSP. You see only what's on the payment message, your own records on parties you've encountered before, and what you can look up from the names and identifiers provided.
    </InsightBox>
  </div>;
}

/* ── Phase 02: Data Inventory ── */
function Phase02(){
  return <div className="fade-in">
    <p style={{fontSize:15,color:C.body,marginBottom:24}}>Before any analysis, enumerate exactly what data IS and IS NOT available to the correspondent bank. This honest inventory determines what the first embedding can realistically encode.</p>
    <Collapsible title="Payment Payload (Parsed)" badge="AVAILABLE" badgeColor={C.green} defaultOpen>
      <CheckItem>Originator name parsed: <strong style={{color:C.tx}}>SILK ROAD COMMODITIES FZE</strong> — entity type: Free Zone Establishment (UAE)</CheckItem>
      <CheckItem>Originator address: PO Box only (JAFZA) — no physical street address</CheckItem>
      <CheckItem>Originator account: <span className="mono">AE42…</span> — IBAN prefix confirms UAE</CheckItem>
      <CheckItem>Beneficiary name parsed: <strong style={{color:C.tx}}>VOSTOK INDUSTRIAL SUPPLY GMBH</strong> — German limited company</CheckItem>
      <CheckItem>Beneficiary address: HAMBURGER STRASSE 42, HAMBURG — physical address present</CheckItem>
      <CheckItem>Beneficiary account: <span className="mono">DE89…</span> — IBAN confirms Germany</CheckItem>
      <CheckItem>F70 NLP: keywords extracted — COTTON, FIBER, SHIPMENT, invoice ref pattern detected</CheckItem>
    </Collapsible>
    <Collapsible title="Respondent Bank Profile (Your Client)" badge="AVAILABLE" badgeColor={C.green}>
      <CheckItem>First Commerce Bank of Eurasia — Nostro client since 2022</CheckItem>
      <CheckItem>Jurisdiction: Georgia — FATF mutual evaluation 2024 noted AML deficiencies</CheckItem>
      <CheckItem>Your internal risk rating: <strong style={{color:C.orange}}>MEDIUM-HIGH</strong> (last annual review: Oct 2025)</CheckItem>
      <CheckItem>Total wire volume through your bank: <span className="mono">$48M</span> past 12 months — up 140% YoY</CheckItem>
      <CheckItem>Prior RFIs sent: 3 in 18 months — response quality: adequate (2), slow (1)</CheckItem>
      <CheckItem>Number of unique originators through this respondent: 47 (past 12 months)</CheckItem>
      <CheckItem>SARs filed on wires from this respondent: 2 (past 3 years)</CheckItem>
    </Collapsible>
    <Collapsible title="Transaction History (Your Books)" badge="AVAILABLE" badgeColor={C.green}>
      <CheckItem>Originator 'Silk Road Commodities' first seen 6 months ago through this respondent</CheckItem>
      <CheckItem>8 prior wires totaling <span className="mono">$12.4M</span> — all commodity-related (cotton, synthetic fiber)</CheckItem>
      <CheckItem>Average wire: <span className="mono">$1.55M</span> — this wire ($2.45M) is 58% above average</CheckItem>
      <CheckItem>All prior wires routed to Deutsche Bank Frankfurt (same downstream PSP)</CheckItem>
      <CheckItem>3 different beneficiaries previously: 2 in Germany, 1 in Turkey</CheckItem>
      <CheckItem>Beneficiary 'Vostok Industrial Supply' — <strong style={{color:C.orange}}>FIRST TIME</strong> seen across entire book</CheckItem>
      <CheckItem>Downstream PSP (Deutsche Bank) — established, high volume, low-risk</CheckItem>
      <CheckItem>No prior alerts on this originator; 1 prior alert on different originator through same respondent (closed, no action)</CheckItem>
    </Collapsible>
    <Collapsible title="Downstream PSP Profile" badge="AVAILABLE" badgeColor={C.green}>
      <CheckItem>Deutsche Bank AG, Frankfurt — <span className="mono">DEUTDEFF</span></CheckItem>
      <CheckItem>Tier-1 global bank, EU-regulated, full FATF-compliant jurisdiction</CheckItem>
      <CheckItem>Your relationship: long-standing correspondent, high volume</CheckItem>
      <CheckItem>Risk profile: <strong style={{color:C.green}}>LOW</strong> — strong AML controls, responsive to inquiries</CheckItem>
      <CheckItem>This PSP will route to beneficiary's account in Hamburg</CheckItem>
    </Collapsible>
    <Collapsible title="Sanctions / Watchlist Screening" badge="AVAILABLE" badgeColor={C.green}>
      <CheckItem>Silk Road Commodities FZE — no exact match (embedding similarity to nearest SDN: <span className="mono">0.52</span>, below threshold)</CheckItem>
      <CheckItem>Vostok Industrial Supply GmbH — no match ('Vostok' in 6 SDN entries, embedding correctly distinguishes)</CheckItem>
      <CheckItem>First Commerce Bank — not sanctioned</CheckItem>
      <CheckItem>Deutsche Bank AG — not sanctioned</CheckItem>
      <CheckItem icon={'\u25D0'} color={C.amber}>Limitation: screening names only. No DOB/ID. Director/UBO names unknown — cannot screen individuals.</CheckItem>
    </Collapsible>
    <Collapsible title="Public / Commercial Data Lookups" badge="PARTIAL" badgeColor={C.amber}>
      <CheckItem>UAE JAFZA registry: entity found — License <span className="mono">JLT-2023-48821</span>, Nov 2023, General Trading</CheckItem>
      <CheckItem icon={'\u2717'} color={C.red}>JAFZA does NOT publicly disclose UBO — ownership unknown</CheckItem>
      <CheckItem>German Handelsregister: Vostok found — <span className="mono">HRB 172845</span>, Hamburg 2019, director: Klaus Becker</CheckItem>
      <CheckItem icon={'\u25D0'} color={C.amber}>No adverse media on entity names (too new/generic)</CheckItem>
      <CheckItem icon={'\u25D0'} color={C.amber}>Cannot screen individual directors/UBOs</CheckItem>
    </Collapsible>
    <Collapsible title="Commodity / Trade Intelligence (from F70)" badge="PARTIAL" badgeColor={C.amber}>
      <CheckItem>Market rate: <span className="mono">$2,100–$2,800/MT</span> for Grade A raw cotton</CheckItem>
      <CheckItem>$2.45M buys ~875–1,167 MT — plausible shipment volume</CheckItem>
      <CheckItem icon={'\u25D0'} color={C.amber}>Cannot verify unit price/quantity/route without trade docs</CheckItem>
      <CheckItem icon={'\u26A0'} color={C.amber}>UAE→Germany corridor flagged in FinCEN Advisory 2023-A002 for TBML</CheckItem>
      <CheckItem icon={'\u26A0'} color={C.amber}>JAFZA known transit point for Central Asian cotton — forced labor risk if Turkmen origin</CheckItem>
      <CheckItem icon={'\u2717'} color={C.red}>Origin country unknown from payment message</CheckItem>
    </Collapsible>
    <InsightBox accent={C.red}>
      <strong style={{color:C.tx}}>What You Still Don't Know</strong>
      {['Who owns Silk Road Commodities (UBO unknown)','Directors/key individuals (no personal names to screen for media/PEP)','Originator\'s full KYC/CDD (belongs to respondent bank)','Actual trade documents (invoice, B/L, certificate of origin)','Whether commodity pricing is legitimate or inflated','Source of funds / source of wealth','Beneficiary\'s full KYC (belongs to downstream PSP)','Relationship between originator and beneficiary'].map((g,i)=><div key={i} style={{borderLeft:`3px solid ${C.red}`,paddingLeft:12,marginTop:8,fontSize:14,color:C.body}}>{g}</div>)}
    </InsightBox>
  </div>;
}

/* ── Phase 03: First Embedding ── */
function Phase03(){
  const dims=[
    {label:'Corridor risk',value:0.78,confidence:'HIGH',source:'BIC: Georgia \u2192 UAE originator \u2192 Germany via Frankfurt'},
    {label:'Originator recency',value:0.72,confidence:'HIGH',source:'First seen 6mo ago, JAFZA license Nov 2023, 8 prior wires'},
    {label:'Respondent risk profile',value:0.70,confidence:'HIGH',source:'Your internal rating: MED-HIGH, FATF deficiencies, 140% volume growth'},
    {label:'Beneficiary novelty',value:0.65,confidence:'HIGH',source:'First-time beneficiary across entire book'},
    {label:'TBML corridor signal',value:0.62,confidence:'MEDIUM',source:'F70 commodity keyword + FinCEN advisory corridor match'},
    {label:'Entity type risk',value:0.60,confidence:'MEDIUM',source:'Parsed as FZE (free zone) from name \u2014 typical TBML vehicle'},
    {label:'Wire amount anomaly',value:0.58,confidence:'HIGH',source:'58% above originator\'s average wire size'},
    {label:'Ownership opacity',value:0.50,confidence:'LOW',source:'INFERRED: FZE + no public UBO in UAE registry = likely opaque'},
    {label:'Sanctions proximity',value:0.42,confidence:'MEDIUM',source:'Name screening only \u2014 no personal identifiers available'},
    {label:'Pricing anomaly',value:0.40,confidence:'LOW',source:'ESTIMATED: amount is plausible but unverifiable without docs'},
    {label:'Network risk',value:0.35,confidence:'LOW',source:'Limited \u2014 first-time beneficiary, no known entity connections'},
    {label:'Adverse media',value:0.15,confidence:'LOW',source:'Entity names only \u2014 no director/UBO names to screen'},
  ];
  return <div className="fade-in">
    <p style={{fontSize:15,color:C.body,marginBottom:24}}>Generate a composite embedding from ALL realistically available data: payment fields, respondent bank profile, your transaction history, counterparty basics, sanctions/watchlist results, public lookups, and commodity intelligence from the remittance text.</p>
    <Section title="Embedding Dimensions — What You Can Actually Encode" accent={C.blue}>
      <div style={{fontSize:13,color:C.muted,marginBottom:16,fontStyle:'italic'}}>Each dimension shows signal strength AND confidence level. HIGH confidence = derived from data you possess. MEDIUM = inferred from available signals. LOW = estimated or inferred from absence of information.</div>
      <CardBox>{dims.map((d,i)=><EmbedBar key={i} label={d.label} value={d.value} confidence={d.confidence} source={d.source} color={C.blue}/>)}</CardBox>
    </Section>
    <InsightBox accent={C.blue}>
      Six dimensions have HIGH confidence — corridor risk, respondent profile, originator recency, wire anomaly, beneficiary novelty, and downstream PSP profile. These are derived from data you actually hold. Two dimensions are MEDIUM — TBML corridor signal and entity type, inferred from payment fields. Four dimensions are LOW confidence — ownership, media, pricing, and network are mostly gaps. The embedding encodes both the signals AND the uncertainty. This partial embedding is still valuable because the GBM has learned from thousands of prior cases which combinations of high-confidence signals predict real risk, even when low-confidence dimensions are ambiguous.
    </InsightBox>
  </div>;
}

/* ── Phase 04: ML Triage ── */
function Phase04(){
  const buckets=[
    {label:'Auto-Close',range:'0\u201325%',color:C.green,pct:'~50\u201360%',desc:'Low risk across all available signals.'},
    {label:'Expedited Review',range:'25\u201350%',color:C.amber,pct:'~18\u201322%',desc:'Some signals. Analyst validates in 15\u201330 min.'},
    {label:'Full Investigation',range:'50\u201380%',color:C.orange,pct:'~12\u201318%',desc:'Material risk + data gaps. Likely needs RFI.',active:true},
    {label:'High Priority / SAR Track',range:'80\u2013100%',color:C.red,pct:'~5\u20138%',desc:'Strong indicators even on available data.'},
  ];
  const shap=[
    {label:'Corridor risk (Georgia\u2192UAE\u2192Germany)',value:0.16},
    {label:'Originator newness (6mo, entity < 3yr)',value:0.14},
    {label:'Respondent risk profile (MED-HIGH)',value:0.11},
    {label:'TBML corridor flag (FinCEN advisory)',value:0.10},
    {label:'Wire 58% above originator average',value:0.08},
    {label:'First-time beneficiary',value:0.07},
    {label:'FZE entity type (free zone)',value:0.05},
    {label:'No sanctions hit',value:-0.05},
    {label:'Downstream PSP Deutsche Bank (low-risk)',value:-0.06},
    {label:'Established respondent relationship (4yr)',value:-0.04},
  ];
  return <div className="fade-in">
    <p style={{fontSize:15,color:C.body,marginBottom:24}}>GBM consumes the detection engine score plus all embedding-derived features. It routes alerts into four buckets. The model has learned from historical dispositions which signal combinations — even with partial data — are worth investigating.</p>
    <CardBox accent={C.orange} style={{textAlign:'center',padding:'32px 24px'}}>
      <div className="mono" style={{fontSize:56,fontWeight:800,color:C.orange}}>74%</div>
      <div style={{fontSize:18,fontWeight:700,color:C.tx,marginTop:4}}>FULL INVESTIGATION</div>
      <div style={{fontSize:13,color:C.dim,marginTop:4}}>Confidence range: 60\u201386% (wider due to low-confidence embedding dims)</div>
      <div style={{fontSize:14,color:C.body,marginTop:12,maxWidth:560,margin:'12px auto 0',lineHeight:1.6}}>GBM scores 74% — not higher — because the model honestly weights confidence levels. With unknown ownership, no adverse media on individuals, and unverified pricing, the model assigns material risk but acknowledges significant uncertainty.</div>

      The respondent's cumulative score feeds BACK into Phase 03 for every future wire. When First Commerce's score crossed 55, the 'Respondent risk profile' embedding dimension increased from 0.50 to 0.70. After this case pushes past 70, that dimension increases again — future wires start at higher baseline risk. This creates a virtuous cycle: bad transactions degrade the score {'\u2192'} degraded score increases scrutiny {'\u2192'} increased scrutiny catches more problems {'\u2192'} which further degrades the score {'\u2192'} until either the respondent cleans up or the relationship exits.
    </InsightBox>
    <Section title="Traditional vs Embedding-Based Respondent Risk" accent={C.fuchsia}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <CardBox style={{borderTop:`3px solid ${C.muted}`}}>
          <div style={{fontSize:12,fontWeight:700,color:C.muted,letterSpacing:'.1em',marginBottom:12}}>TRADITIONAL</div>
          {tradVsEmbed.map((r,i)=><div key={i} style={{borderLeft:`3px solid ${C.muted}33`,paddingLeft:10,marginBottom:8,fontSize:13,color:C.dim}}>{r[0]}</div>)}
        </CardBox>
        <CardBox style={{borderTop:`3px solid ${C.fuchsia}`}}>
          <div style={{fontSize:12,fontWeight:700,color:C.fuchsia,letterSpacing:'.1em',marginBottom:12}}>EMBEDDING-BASED</div>
          {tradVsEmbed.map((r,i)=><div key={i} style={{borderLeft:`3px solid ${C.fuchsia}33`,paddingLeft:10,marginBottom:8,fontSize:13,color:C.body}}>{r[1]}</div>)}
        </CardBox>
      </div>
    </Section>
  </div>;
}

/* ── Phase Components Array ── */
const PHASE_COMPONENTS=[Phase01,Phase02,Phase03,Phase04,Phase05,Phase06,Phase07,Phase08,Phase09,Phase10];

/* ── TOC Component ── */
function TOCSidebar({activePhase,onNavigate}){
  return <nav style={{display:'flex',flexDirection:'column',gap:2}}>
    {PHASE_TITLES.map((title,i)=>{
      const isActive=activePhase===i;
      const color=PHASE_COLORS[i];
      return <a key={i} href={`#phase-${String(i+1).padStart(2,'0')}`}
        onClick={(e)=>{e.preventDefault();onNavigate(i);}}
        style={{
          display:'flex',alignItems:'center',gap:8,padding:'7px 12px',borderRadius:6,
          background:isActive?color+'18':'transparent',
          borderLeft:isActive?`3px solid ${color}`:'3px solid transparent',
          textDecoration:'none',transition:'all .15s',cursor:'pointer',
        }}>
        <span style={{fontSize:11,fontFamily:'Source Code Pro,monospace',fontWeight:700,color:isActive?color:C.muted,minWidth:20}}>{String(i+1).padStart(2,'0')}</span>
        <span style={{fontSize:13,fontWeight:isActive?600:400,color:isActive?C.tx:C.dim,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{title}</span>
        {SCORE_PHASES[i]!==undefined&&<span className="mono" style={{fontSize:10,color:isActive?color:C.muted,marginLeft:'auto',flexShrink:0}}>{SCORE_PHASES[i]}</span>}
      </a>;
    })}
  </nav>;
}

/* ── Mobile TOC ── */
function MobileTOC({activePhase,onNavigate,open,setOpen}){
  return <div style={{position:'fixed',top:0,left:0,right:0,zIndex:1000,background:C.bg,borderBottom:`1px solid ${C.bdr}`}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:16}}>{PHASE_ICONS[activePhase]}</span>
        <span style={{fontSize:13,fontWeight:600,color:C.tx}}>Phase {String(activePhase+1).padStart(2,'0')}: {PHASE_TITLES[activePhase]}</span>
      </div>
      <button onClick={()=>setOpen(!open)} style={{background:'none',border:`1px solid ${C.bdr}`,borderRadius:6,padding:'6px 10px',color:C.tx,cursor:'pointer',fontSize:14}}>
        {open?'\u2715':'\u2630'}
      </button>
    </div>
    {open&&<div style={{padding:'8px 12px 16px',maxHeight:'70vh',overflowY:'auto',background:C.card}}>
      <TOCSidebar activePhase={activePhase} onNavigate={(i)=>{onNavigate(i);setOpen(false);}}/>
    </div>}
  </div>;
}

/* ── Phase Divider ── */
function PhaseDivider({index}){
  const color=PHASE_COLORS[index];
  const score=SCORE_PHASES[index];
  return <div id={`phase-${String(index+1).padStart(2,'0')}`} style={{paddingTop:48,marginBottom:32}}>
    <div style={{height:3,background:`linear-gradient(90deg, ${color}, ${color}44, transparent)`,borderRadius:2,marginBottom:24}}/>
    <div style={{display:'flex',alignItems:'center',gap:14}}>
      <span style={{fontSize:36}}>{PHASE_ICONS[index]}</span>
      <div style={{flex:1}}>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <span className="mono" style={{fontSize:14,fontWeight:700,color}}>PHASE {String(index+1).padStart(2,'0')}</span>
          {score&&<ScoreBadge value={score} color={color}/>}
        </div>
        <h2 style={{fontSize:26,fontWeight:800,color:C.tx,marginTop:2,lineHeight:1.2}}>{PHASE_TITLES[index]}</h2>
        <div style={{fontSize:14,color:C.dim,marginTop:2}}>{PHASE_SUBS[index]}</div>
      </div>
    </div>
  </div>;
}

/* ── Main App ── */
function App(){
  const[activePhase,setActivePhase]=useState(0);
  const[mobileOpen,setMobileOpen]=useState(false);
  const[isMobile,setIsMobile]=useState(window.innerWidth<1024);
  const[showTop,setShowTop]=useState(false);
  const phaseRefs=useRef([]);

  useEffect(()=>{
    const handleResize=()=>setIsMobile(window.innerWidth<1024);
    window.addEventListener('resize',handleResize);
    return ()=>window.removeEventListener('resize',handleResize);
  },[]);

  useEffect(()=>{
    const handleScroll=()=>setShowTop(window.scrollY>400);
    window.addEventListener('scroll',handleScroll,{passive:true});
    return ()=>window.removeEventListener('scroll',handleScroll);
  },[]);

  useEffect(()=>{
    const observer=new IntersectionObserver((entries)=>{
      let best=null;let bestRatio=0;
      entries.forEach(e=>{
        if(e.isIntersecting&&e.intersectionRatio>bestRatio){
          bestRatio=e.intersectionRatio;
          best=parseInt(e.target.dataset.phase,10);
        }
      });
      if(best!==null)setActivePhase(best);
    },{rootMargin:'-10% 0px -60% 0px',threshold:[0,0.1,0.25,0.5]});
    phaseRefs.current.forEach(el=>{if(el)observer.observe(el);});
    return ()=>observer.disconnect();
  },[]);

  const navigateTo=useCallback((idx)=>{
    const el=document.getElementById(`phase-${String(idx+1).padStart(2,'0')}`);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  },[]);

  const scrollToTop=useCallback(()=>{
    window.scrollTo({top:0,behavior:'smooth'});
  },[]);

  return <div style={{minHeight:'100vh'}}>
    {/* Main Content */}
    <div style={{maxWidth:820,margin:'0 auto',padding:'32px 16px 80px'}}>
      {/* Header */}
      <div style={{textAlign:'center',marginBottom:48,paddingTop:isMobile?8:16}}>
        <div style={{fontSize:12,fontWeight:700,color:C.cyan,letterSpacing:'.15em',textTransform:'uppercase',marginBottom:8}}>Interactive Demo</div>
        <h1 style={{fontSize:isMobile?28:36,fontWeight:800,color:C.tx,lineHeight:1.2,marginBottom:8}}>Correspondent Banking AML Pipeline</h1>
        <p style={{fontSize:16,color:C.dim,maxWidth:600,margin:'0 auto 24px',lineHeight:1.6}}>End-to-end: from detection alert to respondent risk exit decision. 10 phases, two embedding passes, one case study.</p>
        <PaymentChain/>
        <div style={{display:'flex',justifyContent:'center',gap:12,marginTop:16,flexWrap:'wrap'}}>
          <Badge color={C.cyan} mono>MT103 / pacs.008</Badge>
          <Badge color={C.orange} mono>GBM TRIAGE</Badge>
          <Badge color={C.indigo} mono>TWO-PASS EMBEDDING</Badge>
          <Badge color={C.red} mono>SAR DECISION</Badge>
          <Badge color={C.fuchsia} mono>RESPONDENT EXIT</Badge>
        </div>
      </div>

      {/* All 10 Phases */}
      {PHASE_COMPONENTS.map((PhaseComponent,i)=>(
        <div key={i} ref={el=>phaseRefs.current[i]=el} data-phase={i}>
          <PhaseDivider index={i}/>
          <PhaseComponent/>
        </div>
      ))}

      {/* Footer */}
      <div style={{marginTop:64,paddingTop:32,borderTop:`1px solid ${C.bdr}`,textAlign:'center'}}>
        <div style={{fontSize:13,color:C.muted}}>Correspondent Banking AML Pipeline</div>
        <div style={{fontSize:12,color:C.muted+'88',marginTop:4}}>All 10 phases in a single scrolling document</div>
      </div>
    </div>

    {/* Back to Top */}
    {showTop&&<button onClick={scrollToTop} style={{
      position:'fixed',bottom:24,right:24,zIndex:999,
      width:44,height:44,borderRadius:'50%',border:`1px solid ${C.bdr}`,
      background:C.card+'ee',backdropFilter:'blur(8px)',
      color:C.tx,fontSize:18,cursor:'pointer',
      display:'flex',alignItems:'center',justifyContent:'center',
      transition:'opacity .2s',boxShadow:'0 4px 12px rgba(0,0,0,.4)',
    }} title="Back to top">{'\u2191'}</button>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Correspondent Banking AML Pipeline — All Phases</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#06070e;color:#c8cde0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100vh}
code,pre,.mono{font-family:'Courier New',Consolas,monospace}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0c0d18}
::-webkit-scrollbar-thumb{background:#2a2d44;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .35s ease-out both}
a{text-decoration:none}
.collapsible-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.collapsible-chevron{color:#5a6080;font-size:18px;transition:transform .2s}
.collapsible-chevron.open{transform:rotate(180deg)}
.collapsible-body{margin-top:16px;padding-top:16px;border-top:1px solid #181a2e}
#back-to-top{position:fixed;bottom:24px;right:24px;z-index:999;width:44px;height:44px;border-radius:50%;border:1px solid #181a2e;background:#0c0d18ee;color:#eef0ff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s;box-shadow:0 4px 12px rgba(0,0,0,.4);opacity:0;pointer-events:none}
#back-to-top.visible{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="root" style="max-width:820px;margin:0 auto;padding:32px 16px 80px"></div>
<button id="back-to-top" title="Back to top">&#8593;</button>

<script>
/* ── Constants ── */
var C={
  bg:'#06070e',card:'#0c0d18',cardHi:'#10112a',
  bdr:'#181a2e',bdrHi:'#252840',
  tx:'#eef0ff',body:'#c8cde0',dim:'#8890b0',muted:'#5a6080',
  slate:'#64748b',cyan:'#0ea5e9',blue:'#3b82f6',orange:'#f97316',
  purple:'#8b5cf6',rose:'#e11d48',indigo:'#6366f1',red:'#ef4444',
  fuchsia:'#d946ef',green:'#22c55e',amber:'#f59e0b',gray:'#5a6080'
};
var PHASE_COLORS=[C.slate,C.cyan,C.blue,C.orange,C.purple,C.rose,C.cyan,C.indigo,C.red,C.fuchsia];
var PHASE_ICONS=['\u26A1','\uD83D\uDCCB','\u25C8','\u2699','\uD83D\uDD0D','\uD83D\uDCE8','\uD83D\uDCC4','\u25C8\u25C8','\u25C9','\uD83C\uDFE6'];
var PHASE_TITLES=['Detection Alert','Data Inventory','First Embedding','ML Triage','Investigation','Targeted RFI','Doc Ingestion','Second Embedding','Final Decision','Respondent Risk'];
var PHASE_SUBS=['Oracle Mantas / Quantexa fires on wire','What you actually know','Embed available intelligence','GBM scoring + routing','Accelerated with AI tools','Fill the gaps','OCR + cross-reference','Re-embed with full picture','GBM re-score + action','Cumulative client risk \u2192 EDD \u2192 Exit'];
var SCORE_PHASES={2:'74%',3:'74%',7:'96%',8:'96%'};

/* ── Unique ID counter ── */
var _uid=0;
function uid(){return 'c'+(_uid++);}

/* ── Helper functions that return HTML strings ── */
function badge(color,text,mono){
  return '<span style="display:inline-block;font-size:11px;font-weight:700;font-family:'+(mono?"'Courier New',Consolas,monospace":"inherit")+';color:'+color+';background:'+color+'18;padding:2px 10px;border-radius:4px;letter-spacing:.04em;text-transform:uppercase">'+text+'</span>';
}

function scoreBadge(value,color){
  return '<span style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:'+color+'22;border:2px solid '+color+';font-size:16px;font-weight:800;color:'+color+';font-family:\'Courier New\',Consolas,monospace">'+value+'</span>';
}

function section(title,accent,html,border){
  var out='<div style="margin-bottom:24px">';
  if(title) out+='<div style="font-size:12px;font-weight:700;color:'+(accent||C.dim)+';letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px">'+title+'</div>';
  if(border) out+='<div style="border-left:3px solid '+(accent||C.bdr)+';padding-left:16px">'+html+'</div>';
  else out+=html;
  out+='</div>';
  return out;
}

function cardBox(html,accent,highlight,extraStyle){
  var bg=highlight?C.cardHi:C.card;
  var bdr=accent?accent+'33':C.bdr;
  var style='background:'+bg+';border:1px solid '+bdr+';border-radius:12px;padding:20px 24px;margin-bottom:16px;'+(extraStyle||'');
  return '<div style="'+style+'">'+html+'</div>';
}

function collapsible(id,title,badgeText,badgeColor,html,defaultOpen){
  var chevClass='collapsible-chevron'+(defaultOpen?' open':'');
  var bodyStyle=defaultOpen?'':'display:none;';
  return cardBox(
    '<div class="collapsible-header" onclick="toggleCollapsible(\''+id+'\')">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<span style="font-size:15px;font-weight:600;color:'+C.tx+'">'+title+'</span>'+
        (badgeText?badge(badgeColor||C.green,badgeText):'')+
      '</div>'+
      '<span id="'+id+'-chevron" class="'+chevClass+'">\u25BE</span>'+
    '</div>'+
    '<div id="'+id+'-body" class="collapsible-body" style="'+bodyStyle+'">'+html+'</div>'
  );
}

function kvRow(label,value,accent,mono){
  var bl=accent?'border-left:3px solid '+accent+';padding-left:12px;':'';
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;'+bl+'gap:12px">'+
    '<span style="color:'+C.dim+';font-size:14px;min-width:0;flex:0 0 auto">'+label+'</span>'+
    '<span style="color:'+C.tx+';font-size:14px;font-family:'+(mono?"'Courier New',Consolas,monospace":"inherit")+';text-align:right;word-break:break-word">'+value+'</span>'+
  '</div>';
}

function embedBar(label,value,confidence,source,color,prevValue){
  var confColor=confidence==='HIGH'?C.green:confidence==='MEDIUM'?C.amber:C.muted;
  var col=color||C.blue;
  var out='<div style="margin-bottom:14px">';
  out+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
  out+='<span style="font-size:14px;color:'+C.tx+';font-weight:500">'+label+'</span>';
  out+='<div style="display:flex;align-items:center;gap:8px">'+badge(confColor,confidence)+
    '<span class="mono" style="font-size:14px;font-weight:700;color:'+col+'">'+value.toFixed(2)+'</span></div></div>';
  out+='<div style="position:relative;height:8px;background:'+C.bdr+';border-radius:4px;overflow:hidden">';
  if(prevValue!==undefined){
    out+='<div style="position:absolute;left:0;top:0;bottom:0;width:'+(prevValue*100)+'%;background:'+col+'33;border-radius:4px"></div>';
  }
  out+='<div style="position:absolute;left:0;top:0;bottom:0;width:'+(value*100)+'%;background:'+col+';border-radius:4px;transition:width .4s"></div>';
  out+='</div>';
  if(source) out+='<div style="font-size:12px;color:'+C.muted+';margin-top:3px;font-style:italic">&quot;'+source+'&quot;</div>';
  out+='</div>';
  return out;
}

function shapBar(label,value){
  var maxMag=0.24;
  var pct=Math.min(Math.abs(value)/maxMag*100,100);
  var isPos=value>0;
  var barHtml;
  if(isPos){
    barHtml='<div style="position:absolute;left:50%;top:2px;bottom:2px;width:'+(pct/2)+'%;background:'+C.red+';border-radius:0 3px 3px 0;transition:width .3s"></div>';
  } else {
    barHtml='<div style="position:absolute;right:50%;top:2px;bottom:2px;width:'+(pct/2)+'%;background:'+C.green+';border-radius:3px 0 0 3px;transition:width .3s"></div>';
  }
  var sign=isPos?'+':'';
  var col=isPos?C.red:C.green;
  return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+
    '<div style="width:200px;text-align:right;font-size:13px;color:'+C.body+';flex-shrink:0">'+label+'</div>'+
    '<div style="flex:1;position:relative;height:20px">'+
      '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:'+C.bdr+'"></div>'+
      barHtml+
    '</div>'+
    '<span class="mono" style="width:50px;font-size:12px;font-weight:600;color:'+col+';text-align:right;flex-shrink:0">'+sign+value.toFixed(2)+'</span>'+
  '</div>';
}

function insightBox(accent,html){
  var col=accent||C.blue;
  return '<div style="border-left:3px solid '+col+';background:'+col+'08;padding:16px 20px;border-radius:0 8px 8px 0;margin-top:16px;margin-bottom:16px;font-size:14px;color:'+C.body+';line-height:1.7">'+html+'</div>';
}

function checkItem(html,icon,color){
  var c=color||C.green;
  var ic=icon||'\u2713';
  return '<div style="display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-left:3px solid '+c+';padding-left:12px;margin-bottom:4px">'+
    '<span style="color:'+c+';flex-shrink:0;font-size:14px">'+ic+'</span>'+
    '<span style="font-size:14px;color:'+C.body+'">'+html+'</span>'+
  '</div>';
}

function paymentChain(){
  var nodes=[
    {label:'Originator',sub:'(Sender)',color:C.muted},
    {label:'Respondent Bank',sub:'(Your Client)',color:C.orange},
    {label:'Your Bank',sub:'(Correspondent)',color:C.blue},
    {label:'Downstream PSP',sub:'(Destination)',color:C.purple},
    {label:'Beneficiary',sub:'(Recipient)',color:C.muted}
  ];
  var out='<div style="display:flex;align-items:center;justify-content:center;gap:0;padding:16px 0;overflow-x:auto;min-width:0">';
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    out+='<div style="display:flex;flex-direction:column;align-items:center;min-width:90px;max-width:130px;flex:0 0 auto">';
    out+='<div style="border:2px solid '+n.color+';border-radius:8px;padding:8px 10px;background:'+n.color+'12;text-align:center;width:100%">';
    out+='<div style="font-size:13px;font-weight:700;color:'+n.color+';line-height:1.3">'+n.label+'</div>';
    out+='<div style="font-size:11px;font-weight:400;color:'+C.dim+';line-height:1.3">'+n.sub+'</div>';
    out+='</div></div>';
    if(i<nodes.length-1){
      out+='<div style="width:28px;height:2px;background:'+C.bdr+';flex-shrink:0;position:relative"><div style="position:absolute;right:-3px;top:-4px;font-size:10px;color:'+C.muted+'">\u2192</div></div>';
    }
  }
  out+='</div>';
  return out;
}

/* ── Phase Divider ── */
function phaseDivider(index){
  var color=PHASE_COLORS[index];
  var score=SCORE_PHASES[index];
  var num=String(index+1).padStart(2,'0');
  var out='<div id="phase-'+num+'" style="padding-top:48px;margin-bottom:32px">';
  out+='<div style="height:3px;background:linear-gradient(90deg,'+color+','+color+'44,transparent);border-radius:2px;margin-bottom:24px"></div>';
  out+='<div style="display:flex;align-items:center;gap:14px">';
  out+='<span style="font-size:36px">'+PHASE_ICONS[index]+'</span>';
  out+='<div style="flex:1">';
  out+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
  out+='<span class="mono" style="font-size:14px;font-weight:700;color:'+color+'">PHASE '+num+'</span>';
  if(score) out+=scoreBadge(score,color);
  out+='</div>';
  out+='<h2 style="font-size:26px;font-weight:800;color:'+C.tx+';margin-top:2px;line-height:1.2">'+PHASE_TITLES[index]+'</h2>';
  out+='<div style="font-size:14px;color:'+C.dim+';margin-top:2px">'+PHASE_SUBS[index]+'</div>';
  out+='</div></div></div>';
  return out;
}

/* ── Phase 01: Detection Alert ── */
function phase01(){
  var out='<div class="fade-in">';
  out+='<p style="font-size:15px;color:'+C.body+';margin-bottom:24px">The detection engine (Oracle Financial Services AML or Quantexa Contextual Monitoring) flags a wire based on scenario rules or contextual behavioral detection applied to the SWIFT message fields. As correspondent, you have the payment payload, your relationship data on the respondent, and transaction history for parties you\'ve previously seen.</p>';

  out+=section('Payment Message (MT103 / pacs.008)',C.slate,
    '<div style="font-size:13px;color:'+C.muted+';margin-bottom:12px;font-style:italic">This is ALL that arrives at your bank when the wire hits. Every field below is parsed from the SWIFT message.</div>'+
    cardBox(
      kvRow("Sender's Ref (F20)","FCB20260418-7741",null,true)+
      kvRow("Value/Amount (F32A)","260218 USD 2,450,000.00",null,true)+
      kvRow("Ordering Customer (F50K)","SILK ROAD COMMODITIES FZE / PO BOX 18447 JAFZA, DUBAI UAE",C.orange,true)+
      kvRow("Ordering Inst. (F52A)","FCBKGETB \u2014 First Commerce Bank of Eurasia, Tbilisi",null,true)+
      kvRow("Intermediary (F56A)","YOUR BANK \u2014 Correspondent",null,true)+
      kvRow("Acct With Inst. (F57A)","DEUTDEFF \u2014 Deutsche Bank Frankfurt (downstream PSP)",null,true)+
      kvRow("Beneficiary (F59)","VOSTOK INDUSTRIAL SUPPLY GMBH / HAMBURGER STRASSE 42, HAMBURG",C.purple,true)+
      kvRow("Remittance (F70)","INV-2026-TR-4418 COTTON FIBER SHIPMENT",C.amber,true)
    )
  );

  var triggers=['Amount > $1M','JAFZA free zone originator','Commodity keyword in F70','Georgia respondent jurisdiction','First-time beneficiary'];
  var trigHtml='';
  for(var i=0;i<triggers.length;i++){
    trigHtml+='<div style="border-left:3px solid '+C.slate+';padding-left:10px;font-size:13px;color:'+C.body+';margin-bottom:4px">'+triggers[i]+'</div>';
  }

  out+=section('Detection Engine Alert',C.slate,
    cardBox(
      kvRow("Alert ID","DET-2026-074821",null,true)+
      kvRow("Engine","Oracle Financial Services AML (Mantas) / Quantexa Contextual Monitoring")+
      kvRow("Scenario","SCN-CB-401: High-value trade wire, high-risk corridor",null,true)+
      kvRow("Detection Score","72 / 100",null,true)+
      '<div style="margin-top:12px"><div style="font-size:12px;font-weight:600;color:'+C.dim+';margin-bottom:6px">TRIGGERED FACTORS</div>'+trigHtml+'</div>'
    )+
    '<div style="font-size:13px;color:'+C.muted+';font-style:italic;margin-top:8px">Whether alert originates from Mantas scenario-based detection or Quantexa contextual monitoring, the downstream embedding pipeline adds intelligence layers neither captures natively.</div>'
  );

  out+=insightBox(C.orange,'<strong style="color:'+C.tx+'">Key Constraint:</strong> You are in the middle of this chain. The originator\'s KYC belongs to your respondent bank. The beneficiary\'s KYC belongs to the downstream PSP. You see only what\'s on the payment message, your own records on parties you\'ve encountered before, and what you can look up from the names and identifiers provided.');

  out+='</div>';
  return out;
}

/* ── Phase 02: Data Inventory ── */
function phase02(){
  var out='<div class="fade-in">';
  out+='<p style="font-size:15px;color:'+C.body+';margin-bottom:24px">Before any analysis, enumerate exactly what data IS and IS NOT available to the correspondent bank. This honest inventory determines what the first embedding can realistically encode.</p>';

  // 1. Payment Payload
  var id1=uid();
  out+=collapsible(id1,'Payment Payload (Parsed)','AVAILABLE',C.green,
    checkItem('Originator name parsed: <strong style="color:'+C.tx+'">SILK ROAD COMMODITIES FZE</strong> \u2014 entity type: Free Zone Establishment (UAE)')+
    checkItem('Originator address: PO Box only (JAFZA) \u2014 no physical street address')+
    checkItem('Originator account: <span class="mono">AE42\u2026</span> \u2014 IBAN prefix confirms UAE')+
    checkItem('Beneficiary name parsed: <strong style="color:'+C.tx+'">VOSTOK INDUSTRIAL SUPPLY GMBH</strong> \u2014 German limited company')+
    checkItem('Beneficiary address: HAMBURGER STRASSE 42, HAMBURG \u2014 physical address present')+
    checkItem('Beneficiary account: <span class="mono">DE89\u2026</span> \u2014 IBAN confirms Germany')+
    checkItem('F70 NLP: keywords extracted \u2014 COTTON, FIBER, SHIPMENT, invoice ref pattern detected')
  ,true);

  // 2. Respondent Bank Profile
  var id2=uid();
  out+=collapsible(id2,'Respondent Bank Profile (Your Client)','AVAILABLE',C.green,
    checkItem('First Commerce Bank of Eurasia \u2014 Nostro client since 2022')+
    checkItem('Jurisdiction: Georgia \u2014 FATF mutual evaluation 2024 noted AML deficiencies')+
    checkItem('Your internal risk rating: <strong style="color:'+C.orange+'">MEDIUM-HIGH</strong> (last annual review: Oct 2025)')+
    checkItem('Total wire volume through your bank: <span class="mono">$48M</span> past 12 months \u2014 up 140% YoY')+
    checkItem('Prior RFIs sent: 3 in 18 months \u2014 response quality: adequate (2), slow (1)')+
    checkItem('Number of unique originators through this respondent: 47 (past 12 months)')+
    checkItem('SARs filed on wires from this respondent: 2 (past 3 years)')
  );

  // 3. Transaction History
  var id3=uid();
  out+=collapsible(id3,'Transaction History (Your Books)','AVAILABLE',C.green,
    checkItem('Originator \'Silk Road Commodities\' first seen 6 months ago through this respondent')+
    checkItem('8 prior wires totaling <span class="mono">$12.4M</span> \u2014 all commodity-related (cotton, synthetic fiber)')+
    checkItem('Average wire: <span class="mono">$1.55M</span> \u2014 this wire ($2.45M) is 58% above average')+
    checkItem('All prior wires routed to Deutsche Bank Frankfurt (same downstream PSP)')+
    checkItem('3 different beneficiaries previously: 2 in Germany, 1 in Turkey')+
    checkItem('Beneficiary \'Vostok Industrial Supply\' \u2014 <strong style="color:'+C.orange+'">FIRST TIME</strong> seen across entire book')+
    checkItem('Downstream PSP (Deutsche Bank) \u2014 established, high volume, low-risk')+
    checkItem('No prior alerts on this originator; 1 prior alert on different originator through same respondent (closed, no action)')
  );

  // 4. Downstream PSP Profile
  var id4=uid();
  out+=collapsible(id4,'Downstream PSP Profile','AVAILABLE',C.green,
    checkItem('Deutsche Bank AG, Frankfurt \u2014 <span class="mono">DEUTDEFF</span>')+
    checkItem('Tier-1 global bank, EU-regulated, full FATF-compliant jurisdiction')+
    checkItem('Your relationship: long-standing correspondent, high volume')+
    checkItem('Risk profile: <strong style="color:'+C.green+'">LOW</strong> \u2014 strong AML controls, responsive to inquiries')+
    checkItem('This PSP will route to beneficiary\'s account in Hamburg')
  );

  // 5. Sanctions / Watchlist Screening
  var id5=uid();
  out+=collapsible(id5,'Sanctions / Watchlist Screening','AVAILABLE',C.green,
    checkItem('Silk Road Commodities FZE \u2014 no exact match (embedding similarity to nearest SDN: <span class="mono">0.52</span>, below threshold)')+
    checkItem('Vostok Industrial Supply GmbH \u2014 no match (\'Vostok\' in 6 SDN entries, embedding correctly distinguishes)')+
    checkItem('First Commerce Bank \u2014 not sanctioned')+
    checkItem('Deutsche Bank AG \u2014 not sanctioned')+
    checkItem('Limitation: screening names only. No DOB/ID. Director/UBO names unknown \u2014 cannot screen individuals.','\u25D0',C.amber)
  );

  // 6. Public / Commercial Data Lookups
  var id6=uid();
  out+=collapsible(id6,'Public / Commercial Data Lookups','PARTIAL',C.amber,
    checkItem('UAE JAFZA registry: entity found \u2014 License <span class="mono">JLT-2023-48821</span>, Nov 2023, General Trading')+
    checkItem('JAFZA does NOT publicly disclose UBO \u2014 ownership unknown','\u2717',C.red)+
    checkItem('German Handelsregister: Vostok found \u2014 <span class="mono">HRB 172845</span>, Hamburg 2019, director: Klaus Becker')+
    checkItem('No adverse media on entity names (too new/generic)','\u25D0',C.amber)+
    checkItem('Cannot screen individual directors/UBOs','\u25D0',C.amber)
  );

  // 7. Commodity / Trade Intelligence
  var id7=uid();
  out+=collapsible(id7,'Commodity / Trade Intelligence (from F70)','PARTIAL',C.amber,
    checkItem('Market rate: <span class="mono">$2,100\u2013$2,800/MT</span> for Grade A raw cotton')+
    checkItem('$2.45M buys ~875\u20131,167 MT \u2014 plausible shipment volume')+
    checkItem('Cannot verify unit price/quantity/route without trade docs','\u25D0',C.amber)+
    checkItem('UAE\u2192Germany corridor flagged in FinCEN Advisory 2023-A002 for TBML','\u26A0',C.amber)+
    checkItem('JAFZA known transit point for Central Asian cotton \u2014 forced labor risk if Turkmen origin','\u26A0',C.amber)+
    checkItem('Origin country unknown from payment message','\u2717',C.red)
  );

  var gaps=['Who owns Silk Road Commodities (UBO unknown)','Directors/key individuals (no personal names to screen for media/PEP)','Originator\'s full KYC/CDD (belongs to respondent bank)','Actual trade documents (invoice, B/L, certificate of origin)','Whether commodity pricing is legitimate or inflated','Source of funds / source of wealth','Beneficiary\'s full KYC (belongs to downstream PSP)','Relationship between originator and beneficiary'];
  var gapHtml='';
  for(var i=0;i<gaps.length;i++){
    gapHtml+='<div style="border-left:3px solid '+C.red+';padding-left:12px;margin-top:8px;font-size:14px;color:'+C.body+'">'+gaps[i]+'</div>';
  }
  out+=insightBox(C.red,'<strong style="color:'+C.tx+'">What You Still Don\'t Know</strong>'+gapHtml);

  out+='</div>';
  return out;
}

/* ── Phase 03: First Embedding ── */
function phase03(){
  var dims=[
    {label:'Corridor risk',value:0.78,confidence:'HIGH',source:'BIC: Georgia \u2192 UAE originator \u2192 Germany via Frankfurt'},
    {label:'Originator recency',value:0.72,confidence:'HIGH',source:'First seen 6mo ago, JAFZA license Nov 2023, 8 prior wires'},
    {label:'Respondent risk profile',value:0.70,confidence:'HIGH',source:'Your internal rating: MED-HIGH, FATF deficiencies, 140% volume growth'},
    {label:'Beneficiary novelty',value:0.65,confidence:'HIGH',source:'First-time beneficiary across entire book'},
    {label:'TBML corridor signal',value:0.62,confidence:'MEDIUM',source:'F70 commodity keyword + FinCEN advisory corridor match'},
    {label:'Entity type risk',value:0.60,confidence:'MEDIUM',source:'Parsed as FZE (free zone) from name \u2014 typical TBML vehicle'},
    {label:'Wire amount anomaly',value:0.58,confidence:'HIGH',source:'58% above originator\'s average wire size'},
    {label:'Ownership opacity',value:0.50,confidence:'LOW',source:'INFERRED: FZE + no public UBO in UAE registry = likely opaque'},
    {label:'Sanctions proximity',value:0.42,confidence:'MEDIUM',source:'Name screening only \u2014 no personal identifiers available'},
    {label:'Pricing anomaly',value:0.40,confidence:'LOW',source:'ESTIMATED: amount is plausible but unverifiable without docs'},
    {label:'Network risk',value:0.35,confidence:'LOW',source:'Limited \u2014 first-time beneficiary, no known entity connections'},

/* ── Phase 10: Respondent Risk ── */
function phase10(){
  var dims=[
    {label:'Typology concentration',value:0.82,desc:'3 of 3 SARs involve TBML commodity trade \u2014 concentrated, not random'},
    {label:'SAR filing rate',value:0.75,desc:'3 SARs from 47 originators \u2014 6.4% vs 2.1% portfolio average'},
    {label:'Originator quality score',value:0.72,desc:'Aggregate risk of all originators \u2014 high-risk FZEs, shell structures dominate'},
    {label:'Volume growth anomaly',value:0.70,desc:'140% YoY growth with no corresponding business expansion'},
    {label:'Client non-cooperation rate',value:0.68,desc:'Rising refusals to provide requested documentation'},
    {label:'RFI responsiveness',value:0.65,desc:'2 adequate, 1 slow, 1 partial, 1 client refusal. Declining trend.'},
    {label:'Jurisdiction risk trajectory',value:0.60,desc:'Georgia FATF deficiencies noted, no improvement action plan'},
    {label:'Downstream risk propagation',value:0.55,desc:'Respondent\'s originators appearing in alerts at other correspondents'}
  ];
  var timeline=[
    {period:'Q1 2024',score:38,color:C.green,note:'Relationship baseline, standard onboarding'},
    {period:'Q3 2024',score:45,color:C.amber,note:'First SAR (TBML, synthetic fiber)'},
    {period:'Q1 2025',score:52,color:C.amber,note:'Second SAR + slow RFI response'},
    {period:'Q3 2025',score:58,color:C.orange,note:'Volume growth 140% YoY, FATF deficiencies'},
    {period:'Q1 2026',score:72,color:C.red,note:'THIS CASE: Third SAR, non-cooperation, BVI opacity'}
  ];
  var thresholds=[
    {score:40,label:'Enhanced Monitoring',detail:'Increase screening sensitivity. Lower GBM auto-close threshold.',triggered:'TRIGGERED Q3 2024',active:true},
    {score:55,label:'Enhanced Due Diligence / EDD',detail:'Request updated KYC, AML program docs, independent testing. Increase RFI frequency.',triggered:'TRIGGERED Q1 2025',active:true},
    {score:70,label:'Senior Management Escalation',detail:'Escalate to BSA Officer. Formal risk acceptance required. Consider volume caps, product restrictions.',triggered:'TRIGGERED NOW',active:true},
    {score:80,label:'Relationship Exit Consideration',detail:'Formal exit assessment. Full dossier to exit committee. 90-day wind-down if approved.',triggered:'NOT YET \u2014 projected Q3 2026',active:false},
    {score:90,label:'Mandatory Exit',detail:'Risk exceeds appetite. Mandatory exit with regulatory notification. Final SAR on pattern.',triggered:'NOT YET',active:false}
  ];
  var tradVsEmbed=[
    ['Annual risk review \u2014 static snapshot','Continuous scoring \u2014 updates with every disposition'],
    ['Checkbox-based questionnaire','Multi-dimensional risk profile from real behavior'],
    ['SAR count as crude metric','Typology concentration, not just SAR count'],
    ['Jurisdiction risk from static list','RFI quality and client cooperation as risk signals'],
    ['No connection between transaction alerts and client risk','Every transaction outcome directly updates client risk'],
    ['Exit decisions reactive and relationship-driven','Exit decisions data-driven with clear audit trail']
  ];

  var out='<div class="fade-in">';
  out+='<p style="font-size:15px;color:'+C.body+';margin-bottom:24px">Every case disposition feeds back into a cumulative risk embedding for the respondent bank itself \u2014 your direct client. Over time, the system builds an evolving picture of each respondent\'s risk posture based on the quality of clients they\'re onboarding, the transactions they\'re allowing, their RFI responsiveness, and confirmed suspicious activity. This drives EDD triggers and ultimately exit decisions.</p>';

  out+=insightBox(C.fuchsia,'<strong style="color:'+C.tx+'">The Feedback Loop \u2014 Transaction \u2192 Client Risk</strong><br/>Every alert disposition from Phases 01\u201309 generates data points about the respondent bank. Over time, these accumulate into a living risk profile. A single SAR doesn\'t trigger an exit \u2014 but a pattern of problematic clients, poor RFI responses, opaque structures, and confirmed typology matches builds a cumulative case that the respondent\'s own AML controls are inadequate.');

  // Signals
  var sigHtml='';
  for(var i=0;i<dims.length;i++){
    var d=dims[i];
    sigHtml+='<div style="margin-bottom:14px">';
    sigHtml+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
    sigHtml+='<span style="font-size:14px;color:'+C.tx+';font-weight:500">'+d.label+'</span>';
    sigHtml+='<span class="mono" style="font-size:14px;font-weight:700;color:'+C.fuchsia+'">'+d.value.toFixed(2)+'</span>';
    sigHtml+='</div>';
    sigHtml+='<div style="position:relative;height:8px;background:'+C.bdr+';border-radius:4px;overflow:hidden">';
    sigHtml+='<div style="position:absolute;left:0;top:0;bottom:0;width:'+(d.value*100)+'%;background:'+C.fuchsia+';border-radius:4px;transition:width .4s"></div>';
    sigHtml+='</div>';
    sigHtml+='<div style="font-size:12px;color:'+C.muted+';margin-top:3px">'+d.desc+'</div>';
    sigHtml+='</div>';
  }
  out+=section('Signals That Build the Respondent Risk Embedding',C.fuchsia,cardBox(sigHtml));

  // Risk Trajectory
  var trajHtml='<div style="display:flex;align-items:flex-end;gap:0;height:180px;padding:0 8px;margin-bottom:12px">';
  for(var i=0;i<timeline.length;i++){
    var t=timeline[i];
    var h=t.score/100*160;
    trajHtml+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px">';
    trajHtml+='<span class="mono" style="font-size:16px;font-weight:800;color:'+t.color+'">'+t.score+'</span>';
    trajHtml+='<div style="width:60%;height:'+h+'px;background:'+t.color+';border-radius:6px 6px 0 0;transition:height .4s"></div>';
    trajHtml+='<span style="font-size:11px;color:'+C.dim+';margin-top:4px;text-align:center">'+t.period+'</span>';
    trajHtml+='</div>';
  }
  trajHtml+='</div>';
  for(var i=0;i<timeline.length;i++){
    var t=timeline[i];
    trajHtml+='<div style="font-size:13px;color:'+C.body+';margin-bottom:4px"><span class="mono" style="color:'+t.color+';margin-right:8px">'+t.period+'</span>'+t.note+'</div>';
  }
  out+=section('Risk Trajectory',C.fuchsia,cardBox(trajHtml));

  // Threshold-Triggered Actions
  var threshHtml='';
  for(var i=0;i<thresholds.length;i++){
    var t=thresholds[i];
    threshHtml+=cardBox(
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
        '<div><span class="mono" style="font-size:13px;color:'+C.dim+'">Score &gt; '+t.score+'</span> <span style="font-size:14px;font-weight:600;color:'+C.tx+';margin-left:8px">'+t.label+'</span></div>'+
        (t.active?badge(C.fuchsia,'\u25CF ACTIVE'):'')+
      '</div>'+
      '<div style="font-size:13px;color:'+(t.active?C.body:C.muted)+'">'+t.detail+'</div>'+
      '<div style="font-size:12px;color:'+C.dim+';margin-top:4px">'+t.triggered+'</div>'
    ,t.active?C.fuchsia:undefined,false,'border-left:3px solid '+(t.active?C.fuchsia:C.muted)+';');
  }
  out+=section('Threshold-Triggered Actions',C.fuchsia,threshHtml);

  // Circular Feedback insight
  out+=insightBox(C.fuchsia,'<strong style="color:'+C.tx+'">Circular Feedback</strong><br/>The respondent\'s cumulative score feeds BACK into Phase 03 for every future wire. When First Commerce\'s score crossed 55, the \'Respondent risk profile\' embedding dimension increased from 0.50 to 0.70. After this case pushes past 70, that dimension increases again \u2014 future wires start at higher baseline risk. This creates a virtuous cycle: bad transactions degrade the score \u2192 degraded score increases scrutiny \u2192 increased scrutiny catches more problems \u2192 which further degrades the score \u2192 until either the respondent cleans up or the relationship exits.');

  // Traditional vs Embedding-Based
  var tradHtml='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  var leftItems='';
  var rightItems='';
  for(var i=0;i<tradVsEmbed.length;i++){
    leftItems+='<div style="border-left:3px solid '+C.muted+'33;padding-left:10px;margin-bottom:8px;font-size:13px;color:'+C.dim+'">'+tradVsEmbed[i][0]+'</div>';
    rightItems+='<div style="border-left:3px solid '+C.fuchsia+'33;padding-left:10px;margin-bottom:8px;font-size:13px;color:'+C.body+'">'+tradVsEmbed[i][1]+'</div>';
  }
  tradHtml+=cardBox(
    '<div style="font-size:12px;font-weight:700;color:'+C.muted+';letter-spacing:.1em;margin-bottom:12px">TRADITIONAL</div>'+leftItems
  ,null,false,'border-top:3px solid '+C.muted+';');
  tradHtml+=cardBox(
    '<div style="font-size:12px;font-weight:700;color:'+C.fuchsia+';letter-spacing:.1em;margin-bottom:12px">EMBEDDING-BASED</div>'+rightItems
  ,null,false,'border-top:3px solid '+C.fuchsia+';');
  tradHtml+='</div>';
  out+=section('Traditional vs Embedding-Based Respondent Risk',C.fuchsia,tradHtml);

  out+='</div>';
  return out;
}

/* ── Toggle collapsible ── */
function toggleCollapsible(id){
  var body=document.getElementById(id+'-body');
  var chev=document.getElementById(id+'-chevron');
  if(!body)return;
  if(body.style.display==='none'||body.style.display===''){
    body.style.display='block';
    chev.classList.add('open');
  } else {
    body.style.display='none';
    chev.classList.remove('open');
  }
}
